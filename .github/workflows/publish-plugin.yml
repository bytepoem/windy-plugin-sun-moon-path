name: publish-plugin

on:
    workflow_dispatch:
        inputs:
            verify_only:
                description: 'Only verify published update mirrors; do not build, upload or write mirrors'
                type: boolean
                default: false

concurrency:
    group: publish-plugin
    cancel-in-progress: false

jobs:
    publish-plugin:
        if: ${{ !inputs.verify_only }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            WINDY_API_KEY: '${{ secrets.WINDY_API_KEY }}'
            GITEE_TOKEN: '${{ secrets.GITEE_TOKEN }}'
            GITHUB_TOKEN: '${{ github.token }}'
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - name: Check publishing credentials
              run: |
                  test -n "$WINDY_API_KEY" || { echo "Missing WINDY_API_KEY"; exit 1; }
                  test -n "$GITEE_TOKEN" || { echo "Missing GITEE_TOKEN"; exit 1; }
            - name: Build
              run: |
                  # npm 10.9.8 crashes while resolving the current Vitest peer dependency tree.
                  npm exec --yes --package=npm@11.12.1 -- npm install
                  npm test
                  node --test scripts/verify-update-site.test.mjs
                  python3 scripts/test_publish_update_mirrors.py
                  npm run build
                  node scripts/build-update-site.mjs "$RUNNER_TEMP/update-site"
                  node scripts/verify-update-site.mjs "$RUNNER_TEMP/update-site"
            - name: Retain exact diagnostic build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: plugin-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      dist/plugin.min.js
                      dist/plugin.min.js.map
                      dist/plugin.min.js.build.json
                  if-no-files-found: error
                  retention-days: 90
            - name: Publish Plugin
              run: |
                  if [ -z "$WINDY_API_KEY" ]; then
                    echo "Secret WINDY_API_KEY is not configured" >&2
                    exit 1
                  fi
                  cd dist
                  echo "Creating plugin archive..."
                  echo "{\"repositoryName\": \"${{ github.repository }}\", \"commitSha\": \"${{ github.sha }}\", \"repositoryOwner\": \"${{ github.repository_owner }}\"}" > /tmp/plugin-info.json
                  mv plugin.json /tmp
                  jq -s '.[0] * .[1]' /tmp/plugin.json /tmp/plugin-info.json > plugin.json
                  # Source maps are useful in local builds but are not runtime assets.
                  # Excluding them keeps the Windy upload request below its size limit.
                  tar --exclude='*.map' -cf ../plugin.tar .
                  # Keep a safety margin below Windy's 4 MB request limit so package
                  # growth fails here with an actionable message instead of at upload.
                  max_plugin_archive_bytes=3800000
                  plugin_archive_bytes=$(wc -c < ../plugin.tar | tr -d '[:space:]')
                  echo "Plugin archive size: ${plugin_archive_bytes} bytes (limit: ${max_plugin_archive_bytes} bytes)"
                  if [ "$plugin_archive_bytes" -gt "$max_plugin_archive_bytes" ]; then
                    echo "Plugin archive exceeds the 3.8 MB release safety limit" >&2
                    exit 1
                  fi
                  echo "Publishing plugin..."
                  curl -s --fail-with-body -XPOST 'https://node.windy.com/plugins/v1.0/upload' -H "x-windy-api-key: ${WINDY_API_KEY}" -F "plugin_archive=@../plugin.tar"
            - name: Publish regional update mirrors
              run: python3 scripts/publish-update-mirrors.py "$RUNNER_TEMP/update-site"

    verify-update-metadata:
        needs: publish-plugin
        if: ${{ always() && !cancelled() && (needs.publish-plugin.result == 'success' || inputs.verify_only) }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                source: [gitee, github]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - name: Test update verification
              run: node --test scripts/verify-update-site.test.mjs
            - name: Verify live update metadata
              env:
                  UPDATE_SOURCE: ${{ matrix.source }}
              run: node scripts/verify-update-site.mjs --source="$UPDATE_SOURCE"
