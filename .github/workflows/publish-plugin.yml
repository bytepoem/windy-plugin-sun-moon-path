name: publish-plugin

on:
    workflow_dispatch:

concurrency:
    group: publish-plugin
    cancel-in-progress: false

jobs:
    publish-plugin:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        env:
            WINDY_API_KEY: '${{ secrets.WINDY_API_KEY }}'
            NETLIFY_AUTH_TOKEN: '${{ secrets.NETLIFY_AUTH_TOKEN }}'
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - name: Check publishing credentials
              run: |
                  test -n "$WINDY_API_KEY" || { echo "Missing WINDY_API_KEY"; exit 1; }
                  test -n "$NETLIFY_AUTH_TOKEN" || { echo "Missing NETLIFY_AUTH_TOKEN"; exit 1; }
            - name: Build
              run: |
                  # npm 10.9.8 crashes while resolving the current Vitest peer dependency tree.
                  npm exec --yes --package=npm@11.12.1 -- npm install
                  npm test
                  python3 scripts/test_publish_update_site.py
                  npm run build
                  node scripts/build-update-site.mjs "$RUNNER_TEMP/update-site"
                  node scripts/verify-update-site.mjs "$RUNNER_TEMP/update-site"
            - name: Publish Plugin
              run: |
                  if [ -z "$WINDY_API_KEY" ]; then
                    echo "Secret WINDY_API_KEY is not configured" >&2
                    exit 1
                  fi
                  cd dist
                  echo "Creating plugin archive..."
                  echo "{\"repositoryName\": \"${{ github.repository }}\", \"commitSha\": \"${{ github.sha }}\", \"repositoryOwner\": \"${{ github.repository_owner }}\"}" > /tmp/plugin-info.json
                  mv plugin.json /tmp
                  jq -s '.[0] * .[1]' /tmp/plugin.json /tmp/plugin-info.json > plugin.json
                  # Source maps are useful in local builds but are not runtime assets.
                  # Excluding them keeps the Windy upload request below its size limit.
                  tar --exclude='*.map' -cf ../plugin.tar .
                  # Keep a safety margin below Windy's 4 MB request limit so package
                  # growth fails here with an actionable message instead of at upload.
                  max_plugin_archive_bytes=3800000
                  plugin_archive_bytes=$(wc -c < ../plugin.tar | tr -d '[:space:]')
                  echo "Plugin archive size: ${plugin_archive_bytes} bytes (limit: ${max_plugin_archive_bytes} bytes)"
                  if [ "$plugin_archive_bytes" -gt "$max_plugin_archive_bytes" ]; then
                    echo "Plugin archive exceeds the 3.8 MB release safety limit" >&2
                    exit 1
                  fi
                  echo "Publishing plugin..."
                  curl -s --fail-with-body -XPOST 'https://node.windy.com/plugins/v1.0/upload' -H "x-windy-api-key: ${WINDY_API_KEY}" -F "plugin_archive=@../plugin.tar"
            - name: Publish update metadata after Windy succeeds
              run: python3 scripts/publish-update-site.py "$RUNNER_TEMP/update-site"
            - name: Verify live update metadata
              run: node scripts/verify-update-site.mjs
